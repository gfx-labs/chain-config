name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      - run: yarn build

      # The generated Go module is published via the dist/networks/v* tag, so it
      # must compile and match what is committed.
      - uses: actions/setup-go@v5
        with:
          go-version-file: dist/networks/go.mod
          cache-dependency-path: dist/networks/go.sum

      - name: Verify generated Go builds
        working-directory: dist/networks
        run: go build ./... && go vet ./...

      - name: Verify generated output is up to date
        run: |
          if ! git diff --exit-code --stat -- dist/networks; then
            echo "::error::dist/networks is out of date; run 'yarn build' and commit the result"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      # semantic-release pushes the version bump and tag to master, so it needs
      # a token from a GitHub App that is on the branch ruleset's bypass list.
      # GITHUB_TOKEN cannot be granted such a bypass.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          registry-url: https://registry.npmjs.org

      - run: yarn install --immutable

      - run: yarn build

      - run: yarn semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
